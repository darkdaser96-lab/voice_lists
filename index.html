<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Голосовые заметки</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --accent: #2aabee;
      --text: #e8eaf0;
      --muted: #8b93a7;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(900px 500px at 90% -10%, rgba(42, 171, 238, 0.2), transparent),
        var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 700;
    }
    p {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      text-decoration: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      padding: 14px 28px;
      border-radius: 12px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    a.btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .hint {
      margin-top: 18px;
      margin-bottom: 0;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Голосовые заметки</h1>
    <p>Отправьте голосовое или текст — бот разложит по спискам: покупки, дела, входящие.</p>
    <a class="btn" href="https://t.me/voice_lists_bot" target="_blank" rel="noopener noreferrer">Открыть бота</a>
    <p class="hint">Бот: @voice_lists_bot</p>
  </main>
</body>
</html>
